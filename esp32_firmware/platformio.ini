; ESP Control - example firmware
; Runs BLE (Nordic UART service) and a WiFi hotspot + WebSocket server at the
; same time, so the app can use either connection type.

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; BLE + WiFi together do not fit in the default 1.2 MB app partition.
board_build.partitions = huge_app.csv
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    links2004/WebSockets@^2.6.1
